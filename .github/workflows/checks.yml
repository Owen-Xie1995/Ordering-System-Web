name: Checks
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-test-only
          MYSQL_DATABASE: ordering_system_test
          MYSQL_USER: ordering
          MYSQL_PASSWORD: test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: ordering_system_test
      DB_USER: ordering
      DB_PASSWORD: test-only
      ALLOW_TEST_DB: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mysqli, gd
      - run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - run: node --test tests/cart.test.js
      - run: php tests/security.php
      - run: python3 tests/http_smoke.py
